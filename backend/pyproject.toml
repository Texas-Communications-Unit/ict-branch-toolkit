[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "ict-branch-toolkit-backend"
version = "0.2.0rc1"
description = "Backend API for ICT Branch Toolkit"
requires-python = ">=3.12,<3.14"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "Django==5.2.18",
  "django-cors-headers==4.9.0",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "dj-database-url==3.1.2",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.3.6",
  "reportlab==4.5.1",
  "pillow==13.0.0",
  "pypdf==6.21.4",
  "openpyxl==3.1.5",
  "cryptography==50.0.2",
  "sqlparse==0.6.0",
  "mgrs==1.5.4",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-cov==7.1.0",
  "pdfplumber==0.11.10",
  "lxml==6.1.3",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers --disable-warnings --cov=apps --cov=config --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
