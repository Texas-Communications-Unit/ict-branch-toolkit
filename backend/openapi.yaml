openapi: 3.0.3
info:
  title: ICT Branch Toolkit API
  version: 0.2.0
  description: Incident communications planning prototype API.
paths:
  /api/audit/revisions/{revision_id}/exports/{export_format}/verify/:
    post:
      operationId: audit_revisions_exports_verify_create
      description: |-
        Let anyone who could have produced an export confirm a file's digest against the audit log.

        Verification reuses the same permission required to produce the export in the first place
        (``plan.export`` for PDFs, ``site.export`` for spatial formats) rather than ``audit.view``, so
        this is genuinely self-service for operators who can already export, not admin-only.
      parameters:
      - in: path
        name: export_format
        schema:
          type: string
        required: true
      - in: path
        name: revision_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDigestVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportDigestVerificationRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Rate-limit token issuance separately from, and more strictly than, the general API.

        Login is a credential-guessing target regardless of authentication state, so it is throttled
        by request rate alone (``ScopedRateThrottle`` keys anonymous requests by IP) rather than by
        the ``anon``/``user`` rates meant for ordinary API traffic.
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSession'
          description: ''
