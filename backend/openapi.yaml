components:
  schemas:
    AcquisitionStateEnum:
      enum:
      - complete
      - partial
      - missing
      - out_of_coverage
      type: string
      description: |-
        * `complete` - Complete
        * `partial` - Partial
        * `missing` - Missing
        * `out_of_coverage` - Out of coverage
    AntennaGainReferenceEnum:
      enum:
      - unknown
      - dbi
      - dbd
      type: string
      description: |-
        * `unknown` - Unknown
        * `dbi` - dBi
        * `dbd` - dBd
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        function:
          type: string
          maxLength: 160
        channel_name:
          type: string
          maxLength: 160
        assignment:
          type: string
          maxLength: 200
        resource_snapshot:
          readOnly: true
        rx_frequency_hz:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        rx_squelch:
          type: string
          maxLength: 40
        tx_frequency_hz:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        tx_squelch:
          type: string
          maxLength: 40
        mode:
          type: string
          maxLength: 40
        remarks:
          type: string
        structured_note:
          oneOf:
          - $ref: '#/components/schemas/StructuredNoteEnum'
          - $ref: '#/components/schemas/BlankEnum'
        contact_name:
          type: string
          maxLength: 160
        site_address:
          type: string
        phone_numbers:
          type: string
          maxLength: 240
        contact_24_hour:
          type: string
          maxLength: 240
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        revision:
          type: string
          format: uuid
        conventional_channel:
          type: string
          format: uuid
          nullable: true
        trunked_talkgroup:
          type: string
          format: uuid
          nullable: true
      required:
      - channel_name
      - created_at
      - function
      - id
      - position
      - resource_snapshot
      - revision
      - updated_at
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    BlankEnum:
      enum:
      - ''
    CalculationStateEnum:
      enum:
      - complete
      - partial
      - unavailable
      type: string
      description: |-
        * `complete` - Complete
        * `partial` - Partial
        * `unavailable` - Unavailable
    ChannelImport:
      type: object
      properties:
        dry_run:
          type: boolean
          default: true
        source:
          $ref: '#/components/schemas/ImportSource'
        release:
          $ref: '#/components/schemas/ImportRelease'
        conventional_channels:
          type: array
          items:
            $ref: '#/components/schemas/ImportConventionalChannel'
        trunked_talkgroups:
          type: array
          items:
            $ref: '#/components/schemas/ImportTrunkedTalkgroup'
      required:
      - release
      - source
    ChannelImportResponse:
      type: object
      properties:
        valid:
          type: boolean
        dry_run:
          type: boolean
        approval_required:
          type: boolean
        would_create:
          type: object
          additionalProperties:
            type: integer
        created:
          type: object
          additionalProperties:
            type: integer
        import_id:
          type: string
          format: uuid
        release_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StructuredImportError'
      required:
      - dry_run
      - errors
      - valid
    ConventionalChannel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        release:
          allOf:
          - $ref: '#/components/schemas/ResourceRelease'
          readOnly: true
        identifier:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 160
        channel_use:
          type: string
          maxLength: 200
        band:
          type: string
          maxLength: 40
        jurisdiction:
          type: string
          maxLength: 80
        rx_frequency_hz:
          type: integer
          maximum: 10000000000
          minimum: 1
          format: int64
        tx_frequency_hz:
          type: integer
          maximum: 10000000000
          minimum: 1
          format: int64
          nullable: true
        bandwidth_hz:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        mode:
          $ref: '#/components/schemas/ModeEnum'
        rx_squelch:
          type: string
          maxLength: 40
        tx_squelch:
          type: string
          maxLength: 40
        emission_designator:
          type: string
          maxLength: 40
        eligibility:
          type: string
        authorization:
          type: string
        source_section:
          type: string
          maxLength: 240
        source_pages:
          type: string
          maxLength: 80
        restrictions:
          type: string
        notes:
          type: string
        is_active:
          type: boolean
      required:
      - id
      - identifier
      - mode
      - name
      - release
      - rx_frequency_hz
    CoordinateFormatEnum:
      enum:
      - map
      - decimal
      - ddm
      - dms
      - mgrs
      - address
      type: string
      description: |-
        * `map` - Map placement
        * `decimal` - Decimal degrees
        * `ddm` - Degrees decimal minutes
        * `dms` - Degrees minutes seconds
        * `mgrs` - USNG/MGRS
        * `address` - Address provider
    CoordinateParse:
      type: object
      properties:
        coordinate:
          type: string
          maxLength: 240
      required:
      - coordinate
