name: Deployment checks

on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deployment-checks.yml"
      - "scripts/deploy-shared-test.sh"
      - "scripts/deployment-recovery-set.py"
      - "scripts/test-deployment-recovery-set.py"
      - "scripts/test-deployment-recovery-integration.py"
      - "scripts/test-deploy-preflight.py"
      - "scripts/sync-fcc-shared-test.sh"
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: |
          bash -n scripts/deploy-shared-test.sh
          bash -n scripts/sync-fcc-shared-test.sh
      - name: Test synthetic recovery success and failure paths
        run: python3 scripts/test-deployment-recovery-set.py
      - name: Verify failed image scans cannot replace running containers
        run: python3 scripts/test-deploy-preflight.py
      - name: Exercise isolated Docker recovery with synthetic data
        run: python3 scripts/test-deployment-recovery-integration.py
      - name: Check environment validation and documentation links
        run: |
          python3 scripts/test-validate-compose-environment.py
          python3 scripts/check-markdown-links.py
