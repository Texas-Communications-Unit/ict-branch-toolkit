name: Sync FCC reference data

on:
  # Routine scheduling belongs to toolkit-fcc-sync.timer on the server.
  # Keep this reviewed, approval-protected workflow as a manual recovery tool.
  workflow_dispatch:
    inputs:
      operation:
        description: Verify Azure/checkout without import, or synchronize FCC data
        required: true
        default: verify
        type: choice
        options: [verify, sync]
      dataset:
        description: FCC dataset to synchronize
        required: true
        default: all
        type: choice
        options: [all, asr, uls_commercial, uls_private]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AZURE_CORE_OUTPUT: none

# Also serialize against application deployments. Guest maintenance locks remain
# authoritative for host-local backups and administrator-started operations.
concurrency:
  group: live-system-deployment
  cancel-in-progress: false

jobs:
  sync:
    name: Approved Azure FCC operation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: shared-test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Reject stale main commit
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Validate Azure FCC configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: python3 scripts/azure-fcc-sync.py --validate-only

      - name: Authenticate to Azure with GitHub identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute approved FCC operation using managed Run Command
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          OPERATION: ${{ github.event_name == 'schedule' && 'sync' || inputs.operation }}
          REQUESTED_DATASET: ${{ inputs.dataset || 'all' }}
        run: |
          case "$OPERATION" in
            verify) python3 scripts/azure-fcc-sync.py --check-only ;;
            sync) python3 scripts/azure-fcc-sync.py --dataset "$REQUESTED_DATASET" ;;
            *) echo "Unsupported FCC operation" >&2; exit 2 ;;
          esac
