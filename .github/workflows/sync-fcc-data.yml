name: Sync FCC reference data

on:
  schedule:
    # FCC complete files are generated Sunday at 05:00 Eastern. This runs
    # Monday at 09:00 UTC (03:00 CST / 04:00 CDT) after publication settles.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dataset:
        description: FCC dataset to synchronize
        required: true
        default: all
        type: choice
        options:
          - all
          - asr
          - uls_commercial
          - uls_private

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: shared-test-fcc-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Download and reconcile official FCC complete files
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload synchronization script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_script=".cache/ict-branch-toolkit/sync-fcc-${GITHUB_RUN_ID}.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '.cache/ict-branch-toolkit' && cat > '$remote_script' && chmod 700 '$remote_script'" \
            < scripts/sync-fcc-shared-test.sh

      - name: Synchronize selected FCC datasets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REQUESTED_DATASET: ${{ inputs.dataset || 'all' }}
        run: |
          remote_script=".cache/ict-branch-toolkit/sync-fcc-${GITHUB_RUN_ID}.sh"
          datasets=(asr uls_commercial uls_private)
          if [[ "$REQUESTED_DATASET" != "all" ]]; then
            datasets=("$REQUESTED_DATASET")
          fi
          for dataset in "${datasets[@]}"; do
            ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash '$remote_script' '$dataset'"
          done

      - name: Remove remote synchronization script
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_script=".cache/ict-branch-toolkit/sync-fcc-${GITHUB_RUN_ID}.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f -- '$remote_script'"

      - name: Remove temporary key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
