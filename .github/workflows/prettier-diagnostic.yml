name: Prettier diagnostic

on:
  push:
    branches: [issue-123-usgs-site-elevation]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier changes
        run: |
          pnpm exec prettier --write src/elevationApi.test.ts src/ElevationEnhancer.test.tsx src/ElevationEnhancer.tsx
          git diff -- src/elevationApi.test.ts src/ElevationEnhancer.test.tsx src/ElevationEnhancer.tsx
