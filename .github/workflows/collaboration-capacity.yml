name: Characterize shared-test collaboration capacity

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-SYNTHETIC-CAPACITY to authorize this retained synthetic test.
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: shared-test-deployment
  cancel-in-progress: false

jobs:
  characterize:
    name: Run guarded synthetic capacity characterization
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: shared-test

    steps:
      - name: Confirm retained synthetic test
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "RUN-SYNTHETIC-CAPACITY"

      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact release candidate
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload run-scoped capacity scripts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_dir=".cache/ict-branch-toolkit/capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$remote_dir' && cat > '$remote_dir/run-shared-test-capacity.sh' && chmod 700 '$remote_dir/run-shared-test-capacity.sh'" \
            < scripts/run-shared-test-capacity.sh
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$remote_dir/validate-capacity-report.py' && chmod 700 '$remote_dir/validate-capacity-report.py'" \
            < scripts/validate-capacity-report.py

      - name: Characterize exact deployed commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          remote_script=".cache/ict-branch-toolkit/capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/run-shared-test-capacity.sh"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_script' '$RELEASE_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'"

      - name: Retrieve retained report
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          install -d -m 700 capacity-results
          report_name="capacity-${RELEASE_SHA:0:12}-github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          remote_report="reports/ict-branch-toolkit/capacity/$report_name"
          if ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s '$remote_report'"; then
            ssh \
              -i "$HOME/.ssh/deploy_key" \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cat '$remote_report'" \
              > "capacity-results/$report_name"
            ssh \
              -i "$HOME/.ssh/deploy_key" \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cat '$remote_report.sha256'" \
              > "capacity-results/$report_name.sha256" || true
          else
            echo "No retained report was available to retrieve."
          fi

      - name: Summarize retrieved report
        if: always()
        run: |
          shopt -s nullglob
          reports=(capacity-results/*.jsonl)
          if [[ "${#reports[@]}" -eq 1 ]]; then
            checksum="${reports[0]}.sha256"
            test -s "$checksum"
            (
              cd capacity-results
              sha256sum --check "$(basename "$checksum")"
            )
            echo "## Shared-test capacity characterization" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/validate-capacity-report.py "${reports[0]}" |
              tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "This is a synthetic characterization of one surplus shared-test host, not a production capacity rating." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete capacity report was retrieved." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload synthetic capacity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: capacity-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove remote run scripts
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_dir=".cache/ict-branch-toolkit/capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf -- '$remote_dir'"

      - name: Remove temporary key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
