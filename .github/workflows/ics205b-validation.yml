name: ICS 205B validation
# Temporary branch-only validation. Remove before merge.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/ics-205b.md"
      - ".github/workflows/ics205b-validation.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check formatting for ICS 205B changed files
        run: >-
          pnpm exec prettier --check
          src/ics205bApi.ts
          src/ICS205BWorkspace.tsx
          src/WorkspaceTabs.tsx
          src/main.tsx
          src/workspaceTabRegistry.ts
      - name: Lint ICS 205B changed frontend files
        run: >-
          pnpm exec eslint
          src/ics205bApi.ts
          src/ICS205BWorkspace.tsx
          src/WorkspaceTabs.tsx
          src/main.tsx
          src/workspaceTabRegistry.ts
          --max-warnings=0
      - run: pnpm typecheck
      - name: Run workspace-tab regression tests
        run: pnpm exec vitest run tests/WorkspaceTabs.test.tsx
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Check formatting for ICS 205B changed files
        run: >-
          ruff format --check
          apps/extensions/models.py
          apps/extensions/ics205b_models.py
          apps/extensions/ics205b_export.py
          apps/extensions/ics205b_serializers.py
          apps/extensions/ics205b_views.py
          apps/extensions/migrations/0002_ics205b.py
          tests/test_ics205b_api.py
      - name: Lint ICS 205B changed backend files
        run: >-
          ruff check
          apps/extensions/models.py
          apps/extensions/ics205b_models.py
          apps/extensions/ics205b_export.py
          apps/extensions/ics205b_serializers.py
          apps/extensions/ics205b_views.py
          apps/extensions/migrations/0002_ics205b.py
          tests/test_ics205b_api.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest tests/test_ics205b_api.py -q
