name: Actions Reconciler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate and report without cancelling or retrying runs
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: actions-reconciler
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  reconcile:
    name: Reconcile recent workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate reconciliation policy
        run: python -m unittest discover -s tests -p 'test_reconcile_actions.py' -v

      - name: Reconcile Actions runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECONCILER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/reconcile-actions.py
