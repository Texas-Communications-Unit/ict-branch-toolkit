name: Issue 144 MapLibre Upgrade

on:
  push:
    branches:
      - issue-144-maplibre-security-upgrade
    paths:
      - .github/workflows/issue-144-maplibre-upgrade.yml

permissions:
  contents: write

concurrency:
  group: issue-144-maplibre-upgrade
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-144-maplibre-security-upgrade
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Upgrade MapLibre and apply the v6 Vite worker migration
        working-directory: frontend
        run: |
          pnpm add maplibre-gl@6.4.1 --save-exact
          python - <<'PY'
          from pathlib import Path

          map_path = Path("src/MapShell.tsx")
          text = map_path.read_text()
          import_line = 'import * as maplibregl from "maplibre-gl";\n'
          worker_import = 'import workerUrl from "maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url";\n'
          setup_line = 'maplibregl.setWorkerUrl(workerUrl);\n\n'

          if worker_import not in text:
              text = text.replace(import_line, import_line + worker_import, 1)
          marker = 'const TEXAS_BOUNDS: LngLatBoundsLike = ['
          if setup_line not in text:
              text = text.replace(marker, setup_line + marker, 1)
          map_path.write_text(text)

          setup_path = Path("tests/setup.ts")
          setup_text = setup_path.read_text()
          navigation_line = '  NavigationControl: class {},\n'
          worker_mock = '  setWorkerUrl: vi.fn(),\n'
          if worker_mock not in setup_text:
              setup_text = setup_text.replace(navigation_line, navigation_line + worker_mock, 1)
          setup_path.write_text(setup_text)
          PY
          pnpm exec prettier --write src/MapShell.tsx tests/setup.ts package.json pnpm-lock.yaml

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm build
          pnpm audit --audit-level high

      - name: Commit remediation and remove temporary workflow
        run: |
          rm .github/workflows/issue-144-maplibre-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/pnpm-lock.yaml frontend/src/MapShell.tsx frontend/tests/setup.ts .github/workflows/issue-144-maplibre-upgrade.yml
          git commit -m "fix: upgrade MapLibre to patched v6 release"
          git push origin HEAD:issue-144-maplibre-security-upgrade
