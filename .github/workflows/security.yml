name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0
          detect --source=/repo --redact --no-banner

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -e ".[dev]" && pip-audit
        working-directory: backend
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level high
        working-directory: frontend

  static-analysis:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_IMAGE: >-
        aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      BACKEND_IMAGE: ict-toolkit-backend:${{ github.sha }}
      FRONTEND_IMAGE: ict-toolkit-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Build candidate images
        run: |
          docker build --tag "$BACKEND_IMAGE" backend
          docker build --target production --tag "$FRONTEND_IMAGE" frontend
      - name: Generate vulnerability-aware CycloneDX SBOMs
        run: |
          mkdir -p security-artifacts
          docker volume create trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            --volume "${{ github.workspace }}/security-artifacts:/artifacts" \
            "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
            --output /artifacts/backend.cdx.json "$BACKEND_IMAGE"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            --volume "${{ github.workspace }}/security-artifacts:/artifacts" \
            "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
            --output /artifacts/frontend.cdx.json "$FRONTEND_IMAGE"
          (
            cd security-artifacts
            sha256sum ./*.cdx.json > SHA256SUMS
          )
      - name: Reject actionable high and critical vulnerabilities
        run: |
          scan_status=0
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$BACKEND_IMAGE" \
            || scan_status=1
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$FRONTEND_IMAGE" \
            || scan_status=1
          exit "$scan_status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-sboms-${{ github.sha }}
          path: security-artifacts/
          if-no-files-found: error
          retention-days: 30
