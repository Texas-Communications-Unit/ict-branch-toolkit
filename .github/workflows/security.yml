name: Security

on:
  pull_request:
  # Main pushes run this full workflow through Deploy to Server before approval.
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Determine security scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      backend_code: ${{ steps.scope.outputs.backend_code }}
      frontend_code: ${{ steps.scope.outputs.frontend_code }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      containers: ${{ steps.scope.outputs.containers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch exact pull request endpoints
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - id: scope
        name: Classify changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo "full=true"
              echo "backend_code=true"
              echo "frontend_code=true"
              echo "dependencies=true"
              echo "containers=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

          matches() {
            grep -Eq "$1" "$RUNNER_TEMP/changed-files.txt"
          }

          full=false
          backend_code=false
          frontend_code=false
          dependencies=false
          containers=false

          if matches '^\.github/(workflows/(security|deploy|phase-2-release-candidate-evaluation)\.yml|dependabot\.yml)$|^scripts/((test-)?security-gate\.py|deploy-shared-test\.sh|database-recovery\.sh)$|^\.gitleaks\.toml$|^\.trivyignore'; then
            full=true
          fi
          if matches '^backend/.*\.py$|^backend/(manage\.py|pyproject\.toml)$'; then
            backend_code=true
          fi
          if matches '^frontend/(src|tests|e2e)/|^frontend/.*\.(ts|tsx|js|jsx)$'; then
            frontend_code=true
          fi
          if matches '^backend/pyproject\.toml$|^frontend/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc)$'; then
            dependencies=true
          fi
          if matches '(^|/)(Dockerfile|\.dockerignore)$|^compose[^/]*\.ya?ml$|^backend/pyproject\.toml$|^frontend/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc)$'; then
            containers=true
          fi

          if [[ "$full" == true ]]; then
            backend_code=true
            frontend_code=true
            dependencies=true
            containers=true
          fi

          {
            echo "full=$full"
            echo "backend_code=$backend_code"
            echo "frontend_code=$frontend_code"
            echo "dependencies=$dependencies"
            echo "containers=$containers"
          } >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Scan every commit in the PR range, including secrets removed later.
          fetch-depth: 0
      - name: Fetch exact pull request endpoints
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
      - id: gitleaks_pr
        name: Scan pull request commits with Gitleaks
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            detect --source=/repo --redact --no-banner \
            --config=/repo/.gitleaks.toml \
            --log-opts="$BASE_SHA..$HEAD_SHA" \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --exit-code=2
          scan_status=$?
          set -e
          echo "exit_code=$scan_status" >> "$GITHUB_OUTPUT"
      - name: Evaluate pull request secret scan
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks_pr.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["GITLEAKS_EXIT_CODE"])
          report = Path("gitleaks-report.json")

          if status not in (0, 2):
              raise SystemExit(f"Gitleaks execution failed with exit code {status}.")

          if not report.exists():
              raise SystemExit("Gitleaks report was not produced.")

          findings = json.loads(report.read_text())
          if status == 2 or findings:
              print(f"Gitleaks detected {len(findings)} finding(s):")
              for finding in findings:
                  rule = finding.get("RuleID", "unknown-rule")
                  file_name = finding.get("File", "unknown-file")
                  line = finding.get("StartLine", "?")
                  print(f"- {rule}: {file_name}:{line}")
              raise SystemExit(1)

          print("No Gitleaks findings detected.")
          PY
      - name: Scan full Git history on main and scheduled runs
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0
          detect --source=/repo --redact --no-banner
          --config=/repo/.gitleaks.toml

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: Audit Python dependencies
        run: pip-audit
      - name: Install frontend toolchain even if Python audit fails
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: ${{ !cancelled() }}
        working-directory: frontend
      - run: pnpm audit --audit-level high
        if: ${{ !cancelled() }}
        working-directory: frontend

  backend-tests:
    name: Backend regression
    needs: changes
    if: needs.changes.outputs.backend_code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: synthetic_security
          POSTGRES_USER: synthetic_security
          POSTGRES_PASSWORD: synthetic-security-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U synthetic_security"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgis://synthetic_security:synthetic-security-only@127.0.0.1:5432/synthetic_security
      DJANGO_ENABLE_GIS: "true"
      ICT_INVENTORY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest --no-cov -q
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file "$RUNNER_TEMP/openapi.yaml" --validate --fail-on-warn

  frontend-tests:
    name: Frontend regression
    needs: changes
    if: needs.changes.outputs.frontend_code == 'true' || needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  codeql-python:
    name: CodeQL (python)
    needs: changes
    if: needs.changes.outputs.backend_code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  codeql-javascript:
    name: CodeQL (javascript-typescript)
    needs: changes
    if: needs.changes.outputs.frontend_code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: frontend
      - name: Verify production frontend build
        run: pnpm build
        working-directory: frontend
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  container-security:
    name: Container security and SBOM
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      BACKEND_IMAGE: ict-toolkit-backend:${{ github.sha }}
      FRONTEND_IMAGE: ict-toolkit-frontend:${{ github.sha }}
      DATABASE_IMAGE: ict-toolkit-db:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Build candidate images
        run: |
          docker build --pull --tag "$BACKEND_IMAGE" backend
          docker build --pull --target production --tag "$FRONTEND_IMAGE" frontend
          docker build --pull --tag "$DATABASE_IMAGE" database
      - name: Generate vulnerability-aware CycloneDX SBOMs
        run: |
          mkdir -p security-artifacts
          docker volume create trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            --volume "${{ github.workspace }}/security-artifacts:/artifacts" \
            "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
            --output /artifacts/backend.cdx.json "$BACKEND_IMAGE"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            --volume "${{ github.workspace }}/security-artifacts:/artifacts" \
            "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
            --output /artifacts/frontend.cdx.json "$FRONTEND_IMAGE"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            --volume "${{ github.workspace }}/security-artifacts:/artifacts" \
            "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
            --output /artifacts/database.cdx.json "$DATABASE_IMAGE"
          # Keep canonical severity, vendor status, and fixed-version fields for triage.
          for target in backend frontend database; do
            case "$target" in
              backend) image="$BACKEND_IMAGE" ;;
              frontend) image="$FRONTEND_IMAGE" ;;
              database) image="$DATABASE_IMAGE" ;;
            esac
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume trivy-cache:/root/.cache/trivy \
              --volume "${{ github.workspace }}/security-artifacts:/artifacts" \
              "$TRIVY_IMAGE" image --scanners vuln --format json \
              --output "/artifacts/$target.trivy.json" "$image"
          done
          (
            cd security-artifacts
            sha256sum ./*.json > SHA256SUMS
          )
      - name: Reject actionable high and critical vulnerabilities
        run: |
          scan_status=0
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$BACKEND_IMAGE" \
            || scan_status=1
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$FRONTEND_IMAGE" \
            || scan_status=1
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$DATABASE_IMAGE" \
            || scan_status=1
          exit "$scan_status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-sboms-${{ github.sha }}
          path: security-artifacts/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Security gate
    if: always()
    needs: [changes, secrets, dependency-audit, backend-tests, frontend-tests, codeql-python, codeql-javascript, container-security, installed-stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require every applicable security and regression check
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_SCAN: ${{ github.event_name != 'pull_request' }}
        run: |
          python scripts/test-security-gate.py
          python scripts/security-gate.py

  installed-stack:
    name: Installed stack validation
    needs: changes
    if: needs.changes.outputs.backend_code == 'true' || needs.changes.outputs.containers == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/phase-2-release-candidate-evaluation.yml
