name: Deploy to Server
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'verify' && 'Verify Azure deployment connection' || 'Deploy current main to Azure' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify Azure connection or deploy the scanned current main
        type: choice
        options: [verify, deploy]
        default: verify
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AZURE_CORE_OUTPUT: none

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'verify' && 'azure-deployment-connectivity-check' || 'live-system-deployment' }}
  cancel-in-progress: false

jobs:
  security:
    name: Pre-deployment security
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  deploy:
    name: Approved Azure operation
    needs: security
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: shared-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve current main commit
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          candidate="$(git rev-parse HEAD)"
          test "$candidate" = "$GITHUB_SHA"
          if [[ "$candidate" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "Refusing a stale deployment: main changed after this commit was scanned." >&2
            exit 1
          fi

      - name: Validate Azure deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: python3 scripts/azure-deploy.py --validate-only

      - name: Authenticate to Azure with GitHub identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute approved operation using managed Run Command
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
        run: |
          case "$OPERATION" in
            verify) python3 scripts/azure-deploy.py --check-only ;;
            deploy) python3 scripts/azure-deploy.py ;;
            *) echo "Unsupported operation" >&2; exit 2 ;;
          esac
