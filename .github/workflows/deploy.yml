name: Deploy to Server
run-name: Read-only Azure SSH connectivity probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: live-system-deployment
  cancel-in-progress: false

jobs:
  connectivity:
    name: Read-only runner connectivity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare target and probe public SSH connectivity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          python3 - <<'PY'
          import os
          import socket

          configured = os.environ["DEPLOY_HOST"].strip()
          canonical = "toolkit.tx-comu.org"
          port = int(os.environ["DEPLOY_PORT"].strip())
          try:
              same = socket.gethostbyname(configured) == socket.gethostbyname(canonical)
              print(f"Configured host matches public Toolkit IPv4: {same}", flush=True)
          except OSError as error:
              print(f"Target comparison failed: {type(error).__name__}", flush=True)
          print(f"Configured port is standard SSH port: {port == 22}", flush=True)
          for label, host, number in (("Configured", configured, port), ("Public Toolkit", canonical, 22)):
              try:
                  with socket.create_connection((host, number), timeout=10):
                      print(f"{label} TCP connection: reachable", flush=True)
              except OSError as error:
                  print(f"{label} TCP connection: {type(error).__name__}", flush=True)
          PY
      - name: Verify SSH identity without changing server state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/probe_key" "$HOME/.ssh/probe_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/probe_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/probe_hosts"
          chmod 600 "$HOME/.ssh/probe_key" "$HOME/.ssh/probe_hosts"
          ssh -i "$HOME/.ssh/probe_key" -p "$DEPLOY_PORT" \
            -o UserKnownHostsFile="$HOME/.ssh/probe_hosts" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" true

  security:
    name: Pre-deployment security
    if: ${{ false }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  deploy:
    name: Deploy current main
    if: ${{ false }}
    needs: security
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: shared-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve current main commit
        id: resolve_main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          candidate="$(git rev-parse HEAD)"
          test "$candidate" = "$GITHUB_SHA"
          if [[ "$candidate" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "Refusing a stale deployment: main changed after this commit was scanned." >&2
            exit 1
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify server connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            true

      - name: Recover safe disk capacity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "Disk usage before safe cleanup:"
          df -h "$HOME" || true
          docker system df || true

          # Remove only abandoned deployment scratch directories and Docker data
          # that is not referenced by active containers. Named volumes are never pruned.
          find "$HOME/.cache/ict-branch-toolkit" \
            -mindepth 1 -maxdepth 1 -type d -name 'deploy-*' -mtime +1 \
            -exec rm -rf -- {} + 2>/dev/null || true
          docker builder prune --force --filter 'until=168h' || true
          docker container prune --force --filter 'until=168h' || true
          docker image prune --all --force --filter 'until=168h' || true

          echo "Disk usage after safe cleanup:"
          df -h "$HOME" || true
          docker system df || true

          available_kb="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          minimum_kb=$((2 * 1024 * 1024))
          if (( available_kb < minimum_kb )); then
            echo "Refusing deployment: less than 2 GiB is free after safe cleanup." >&2
            exit 1
          fi
          REMOTE

      - name: Upload deployment scripts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          remote_dir=".cache/ict-branch-toolkit/deploy-${GITHUB_RUN_ID}"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$remote_dir' && cat > '$remote_dir/deploy-shared-test.sh' && chmod 700 '$remote_dir/deploy-shared-test.sh'" \
            < scripts/deploy-shared-test.sh
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$remote_dir/validate-compose-environment.py' && chmod 700 '$remote_dir/validate-compose-environment.py'" \
            < scripts/validate-compose-environment.py
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$remote_dir/deployment-recovery-set.py' && chmod 700 '$remote_dir/deployment-recovery-set.py'" \
            < scripts/deployment-recovery-set.py

      - name: Deploy current main commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MAIN_SHA: ${{ steps.resolve_main.outputs.sha }}
        shell: bash
        run: |
          remote_script=".cache/ict-branch-toolkit/deploy-${GITHUB_RUN_ID}/deploy-shared-test.sh"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_script' '$MAIN_SHA'"

      - name: Remove remote deployment scripts
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          remote_dir=".cache/ict-branch-toolkit/deploy-${GITHUB_RUN_ID}"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf -- '$remote_dir'" || true

      - name: Remove temporary key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
