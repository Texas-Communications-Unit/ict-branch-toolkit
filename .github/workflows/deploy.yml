name: Deploy to Server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: live-system-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy current main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: shared-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve current main commit
        id: resolve_main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          echo "sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify server connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            true

      - name: Recover safe disk capacity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "Disk usage before safe cleanup:"
          df -h "$HOME" || true
          docker system df || true

          # Remove only abandoned deployment scratch directories and Docker data
          # that is not referenced by active containers. Named volumes are never pruned.
          find "$HOME/.cache/ict-branch-toolkit" \
            -mindepth 1 -maxdepth 1 -type d -name 'deploy-*' -mtime +1 \
            -exec rm -rf -- {} + 2>/dev/null || true
          docker builder prune --force --filter 'until=168h' || true
          docker container prune --force --filter 'until=168h' || true
          docker image prune --all --force --filter 'until=168h' || true

          echo "Disk usage after safe cleanup:"
          df -h "$HOME" || true
          docker system df || true

          available_kb="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          minimum_kb=$((2 * 1024 * 1024))
          if (( available_kb < minimum_kb )); then
            echo "Refusing deployment: less than 2 GiB is free after safe cleanup." >&2
            exit 1
          fi
          REMOTE

      - name: Upload deployment scripts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          remote_dir=".cache/ict-branch-toolkit/deploy-${GITHUB_RUN_ID}"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$remote_dir' && cat > '$remote_dir/deploy-shared-test.sh' && chmod 700 '$remote_dir/deploy-shared-test.sh'" \
            < scripts/deploy-shared-test.sh
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$remote_dir/validate-compose-environment.py' && chmod 700 '$remote_dir/validate-compose-environment.py'" \
            < scripts/validate-compose-environment.py

      - name: Deploy current main commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MAIN_SHA: ${{ steps.resolve_main.outputs.sha }}
        shell: bash
        run: |
          remote_script=".cache/ict-branch-toolkit/deploy-${GITHUB_RUN_ID}/deploy-shared-test.sh"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_script' '$MAIN_SHA'"

      - name: Remove remote deployment scripts
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          remote_dir=".cache/ict-branch-toolkit/deploy-${GITHUB_RUN_ID}"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf -- '$remote_dir'" || true

      - name: Remove temporary key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
