name: Deploy to Server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AZURE_CORE_OUTPUT: none

concurrency:
  group: live-system-deployment
  cancel-in-progress: false

jobs:
  security:
    name: Pre-deployment security
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  deploy:
    name: Deploy current main through Azure
    needs: security
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: shared-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve current main commit
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          candidate="$(git rev-parse HEAD)"
          test "$candidate" = "$GITHUB_SHA"
          if [[ "$candidate" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "Refusing a stale deployment: main changed after this commit was scanned." >&2
            exit 1
          fi

      - name: Validate Azure deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: python3 scripts/azure-deploy.py --validate-only

      - name: Authenticate to Azure with GitHub identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy scanned commit using managed Run Command
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: python3 scripts/azure-deploy.py
