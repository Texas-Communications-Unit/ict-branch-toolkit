name: ICS 205B formatter

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/apps/extensions/ics205b_*.py"
      - "backend/apps/extensions/migrations/0002_ics205b.py"
      - "backend/tests/test_ics205b_api.py"
      - "frontend/src/ics205bApi.ts"
      - "frontend/src/ICS205BWorkspace.tsx"
      - ".github/workflows/ics205b-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: frontend
      - run: >-
          pnpm exec prettier --write
          src/ics205bApi.ts
          src/ICS205BWorkspace.tsx
        working-directory: frontend
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.13.2
      - run: >-
          ruff format
          apps/extensions/ics205b_export.py
          apps/extensions/ics205b_serializers.py
          apps/extensions/ics205b_views.py
          apps/extensions/migrations/0002_ics205b.py
          tests/test_ics205b_api.py
        working-directory: backend
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "ICS 205B files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/ics205bApi.ts \
            frontend/src/ICS205BWorkspace.tsx \
            backend/apps/extensions/ics205b_export.py \
            backend/apps/extensions/ics205b_serializers.py \
            backend/apps/extensions/ics205b_views.py \
            backend/apps/extensions/migrations/0002_ics205b.py \
            backend/tests/test_ics205b_api.py
          git commit -m "style: format ICS 205B implementation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
