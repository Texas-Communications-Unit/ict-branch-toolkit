name: Probe FCC archive capacity

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Official FCC complete archive to inspect without importing
        required: true
        type: choice
        options:
          - asr
          - uls_commercial
          - uls_private

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: shared-test-fcc-capacity-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe official FCC archive without database writes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared-test

    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v7

      - name: Refuse non-main revisions
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload no-write probe script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_script=".cache/ict-branch-toolkit/probe-fcc-${GITHUB_RUN_ID}.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '.cache/ict-branch-toolkit' && cat > '$remote_script' && chmod 700 '$remote_script'" \
            < scripts/probe-fcc-shared-test.sh

      - name: Run no-write capacity probe
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_script=".cache/ict-branch-toolkit/probe-fcc-${GITHUB_RUN_ID}.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_script' '${{ inputs.dataset }}'"

      - name: Remove remote probe script
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_script=".cache/ict-branch-toolkit/probe-fcc-${GITHUB_RUN_ID}.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f -- '$remote_script'"

      - name: Remove temporary key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
