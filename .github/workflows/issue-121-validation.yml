name: Issue 121 editing validation

on:
  push:
    branches:
      - issue-121-edit-incident-operational-period
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-121-editing-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare synthetic development environment
        run: cp .env.example .env

      - name: Build validation containers
        run: docker compose build backend frontend

      - name: Check backend formatting
        run: |
          docker compose run --rm backend ruff format apps/incidents tests/test_incidents_api.py
          git diff -- backend/apps/incidents backend/tests/test_incidents_api.py
          git diff --exit-code -- backend/apps/incidents backend/tests/test_incidents_api.py

      - name: Lint backend
        run: docker compose run --rm backend ruff check apps/incidents tests/test_incidents_api.py --output-format=github

      - name: Check Django configuration and migrations
        run: |
          docker compose run --rm backend python manage.py check
          docker compose run --rm backend python manage.py makemigrations --check --dry-run

      - name: Run incident API regression tests
        run: docker compose run --rm backend pytest tests/test_incidents_api.py

      - name: Check frontend formatting
        run: docker compose run --rm frontend pnpm format:check

      - name: Lint and type-check frontend
        run: |
          docker compose run --rm frontend pnpm lint
          docker compose run --rm frontend pnpm typecheck

      - name: Run incident editor component tests
        run: docker compose run --rm frontend pnpm exec vitest run src/IncidentMetadataEditor.test.tsx

      - name: Build frontend
        run: docker compose run --rm frontend pnpm build
