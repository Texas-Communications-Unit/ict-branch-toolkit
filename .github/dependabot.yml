version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    assignees: [KD7CAO]
    # These bounds apply to routine version proposals, not security updates.
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      python-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    assignees: [KD7CAO]
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      javascript-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      javascript-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [KD7CAO]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    assignees: [KD7CAO]
    # Keep the selected Python 3.12 minor line; 3.13+ needs a planned upgrade.
    allow:
      - dependency-name: python
        update-types: [version-update:semver-patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    assignees: [KD7CAO]
    allow:
      - dependency-name: node
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: nginx
        update-types: [version-update:semver-minor, version-update:semver-patch]
  - package-ecosystem: docker
    directory: /database
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    assignees: [KD7CAO]
    # Database major/minor migrations and Go minor changes need separate review.
    allow:
      - dependency-name: postgis/postgis
        update-types: [version-update:semver-patch]
      - dependency-name: golang
        update-types: [version-update:semver-patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    assignees: [KD7CAO]
    allow:
      - dependency-name: postgis/postgis
        update-types: [version-update:semver-patch]
