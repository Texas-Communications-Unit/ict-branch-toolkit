title = "ICT Branch Toolkit Gitleaks configuration"

# Keep the complete upstream Gitleaks ruleset. Repository-specific allowlists
# are added only for reviewed false positives.
[extend]
useDefault = true

[[allowlists]]
description = "Pinned public Trivy image digest used for container integrity"
condition = "AND"
regexTarget = "line"
paths = ['''^\.github/workflows/security\.yml$''', '''^scripts/deploy-shared-test\.sh$''']
regexes = ['''(?:TRIVY_IMAGE:\s+|trivy_image=')aquasec/trivy:0\.72\.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f''']

[[allowlists]]
description = "Environment template placeholders"
paths = ['''^\.env\.example$''']
